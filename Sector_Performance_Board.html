<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NIFTY Sector Performance Board</title>
<style>
  /* ============================================================
     THEME
     Monochrome surfaces; colour is reserved for direction only.
     Two themes only - dark (default) and light - selected by the
     [data-theme] attribute, which is set on <html> before paint so
     there is no flash of the wrong theme on load.
     ============================================================ */
  :root{
    color-scheme: light;
    --plane:#f9f9f7;
    --surface:#fcfcfb;
    --surface-2:#f2f1ee;
    --ink:#0b0b0b;
    --ink-2:#52514e;
    --ink-3:#898781;
    --line:#e1e0d9;
    --border:rgba(11,11,11,0.10);
    --border-strong:rgba(11,11,11,0.22);
    --up:#006300;
    --down:#d03b3b;
    --up-wash:rgba(0,99,0,0.10);
    --down-wash:rgba(208,59,59,0.10);
    --shadow:0 1px 2px rgba(11,11,11,0.04), 0 8px 24px rgba(11,11,11,0.04);
    --radius:12px;
    --radius-sm:8px;
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --plane:#0d0d0d;
    --surface:#1a1a19;
    --surface-2:#232321;
    --ink:#ffffff;
    --ink-2:#c3c2b7;
    --ink-3:#898781;
    --line:#2c2c2a;
    --border:rgba(255,255,255,0.10);
    --border-strong:rgba(255,255,255,0.24);
    --up:#0ca30c;
    --down:#e66767;
    --up-wash:rgba(12,163,12,0.14);
    --down-wash:rgba(230,103,103,0.14);
    --shadow:0 1px 2px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.3);
  }

  /* ============================================================
     BASE
     ============================================================ */
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:var(--plane);
    color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .num{font-variant-numeric:tabular-nums;}
  .app{max-width:1160px;margin:0 auto;padding:32px 16px 72px;}

  nav.tabs{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);
           border-radius:var(--radius-sm);padding:2px;margin-bottom:16px;}
  nav.tabs a{text-decoration:none;color:var(--ink-2);font-size:13px;font-weight:500;
             padding:6px 14px;border-radius:6px;transition:background .12s,color .12s;}
  nav.tabs a:hover{color:var(--ink);}
  nav.tabs a[aria-current="page"]{background:var(--surface);color:var(--ink);font-weight:600;}

  /* ============================================================
     HEADER
     ============================================================ */
  header{
    display:flex;justify-content:space-between;align-items:flex-start;
    gap:20px;flex-wrap:wrap;margin-bottom:22px;
  }
  .eyebrow{
    font-size:11px;letter-spacing:0.12em;text-transform:uppercase;
    color:var(--ink-3);margin-bottom:6px;font-weight:600;
  }
  h1{font-size:26px;line-height:1.15;margin:0;font-weight:640;letter-spacing:-0.02em;}
  .sub{color:var(--ink-2);font-size:13px;margin-top:5px;}
  .controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}

  /* segmented timeframe control */
  .seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);
       border-radius:var(--radius-sm);padding:2px;}
  .seg button{
    border:none;background:transparent;color:var(--ink-2);
    font:inherit;font-size:13px;font-weight:500;
    padding:6px 13px;border-radius:6px;cursor:pointer;
    transition:background .12s ease,color .12s ease;
  }
  .seg button:hover{color:var(--ink);}
  .seg button[aria-pressed="true"]{
    background:var(--surface);color:var(--ink);font-weight:600;
    box-shadow:0 1px 2px rgba(0,0,0,0.06);
  }

  .btn{
    font:inherit;font-size:13px;font-weight:500;
    background:var(--surface);color:var(--ink);
    border:1px solid var(--border);border-radius:var(--radius-sm);
    padding:7px 13px;cursor:pointer;
    transition:border-color .12s ease,background .12s ease;
    display:inline-flex;align-items:center;gap:7px;
  }
  .btn:hover{border-color:var(--border-strong);}
  .btn:disabled{opacity:.55;cursor:default;}
  .btn.primary{background:var(--ink);color:var(--plane);border-color:var(--ink);font-weight:600;}
  .btn.primary:hover{opacity:.88;}
  .btn.on{border-color:var(--border-strong);box-shadow:inset 0 0 0 1px var(--border);}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--ink-3);}
  .btn.on .dot{background:var(--up);}
  .icon-btn{padding:7px 10px;}

  .meta{
    display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;
    font-size:12px;color:var(--ink-3);margin-bottom:20px;
  }
  .meta .sep{opacity:.5;}
  #liveStatus{font-size:12px;}

  /* ============================================================
     SUMMARY STRIP
     ============================================================ */
  /* Self-contained cards rather than a hairline-gap panel: with 3 or 4 tiles and
     a variable width, a partly-filled last row would otherwise leave an empty box. */
  .summary{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:10px;margin-bottom:26px;
  }
  .stat{
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);padding:14px 16px;min-width:0;
  }
  .stat .value,.stat .note{overflow-wrap:anywhere;}
  .stat .label{font-size:11px;letter-spacing:0.07em;text-transform:uppercase;
               color:var(--ink-3);font-weight:600;margin-bottom:7px;}
  .stat .value{font-size:23px;font-weight:650;letter-spacing:-0.02em;line-height:1.1;}
  .stat .value small{font-size:13px;font-weight:500;color:var(--ink-3);letter-spacing:0;}
  .stat .note{font-size:12px;color:var(--ink-2);margin-top:3px;}
  .stat.up .value{color:var(--up);} .stat.down .value{color:var(--down);}

  /* ============================================================
     SECTION HEADING
     ============================================================ */
  .section-head{
    display:flex;justify-content:space-between;align-items:baseline;
    margin:0 0 13px;gap:12px;
  }
  .section-head h2{
    font-size:12px;letter-spacing:0.09em;text-transform:uppercase;
    color:var(--ink-3);margin:0;font-weight:600;
  }
  .hint{font-size:12px;color:var(--ink-3);}

  /* ============================================================
     SECTOR GRID
     ============================================================ */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:12px;}
  .card{
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);padding:15px 16px 13px;
    cursor:pointer;position:relative;text-align:left;width:100%;
    font:inherit;color:inherit;
    transition:border-color .12s ease,transform .12s ease,box-shadow .12s ease;
  }
  .card:hover{border-color:var(--border-strong);transform:translateY(-2px);box-shadow:var(--shadow);}
  .card:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .card .name{font-size:15px;font-weight:620;letter-spacing:-0.01em;}
  .card .idx{font-size:11px;color:var(--ink-3);margin-top:2px;letter-spacing:0.02em;}
  .card .rank{font-size:11px;color:var(--ink-3);font-weight:600;}
  .pct{font-size:22px;font-weight:650;letter-spacing:-0.02em;margin-top:11px;
       display:flex;align-items:baseline;gap:5px;}
  .pct .arrow{font-size:12px;line-height:1;}
  .up .pct{color:var(--up);} .down .pct{color:var(--down);}
  .flat .pct{color:var(--ink-2);}

  /* TradingView deep links */
  .tv{
    display:inline-flex;align-items:center;gap:3px;
    color:var(--ink-3);text-decoration:none;font-size:11px;font-weight:600;
    border:1px solid transparent;border-radius:6px;padding:2px 5px;margin:-2px -5px;
    transition:color .12s ease,border-color .12s ease,background .12s ease;
  }
  .tv:hover{color:var(--ink);border-color:var(--border);background:var(--surface-2);}
  .tv:focus-visible{outline:2px solid var(--ink);outline-offset:1px;}
  .tv .ext{font-size:10px;opacity:.8;}
  .card .tv-corner{position:absolute;top:11px;right:34px;opacity:0;transition:opacity .12s ease;}
  .card:hover .tv-corner,.card:focus-within .tv-corner{opacity:1;}
  td .tv{font-size:inherit;font-weight:600;color:var(--ink);}
  td .tv:hover{color:var(--ink);text-decoration:underline;}
  .dd-head .tv{font-size:13px;}

  /* ============================================================
     SPARKLINE
     ============================================================ */
  .spark{display:block;width:100%;height:38px;margin-top:10px;overflow:visible;cursor:crosshair;}
  .spark polyline,.spark path{fill:none;}
  .spark .line{stroke-width:1.5px;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round;}
  .spark .area{stroke:none;}
  .spark .base{stroke:var(--ink-3);stroke-width:1px;opacity:.45;stroke-dasharray:2 3;vector-effect:non-scaling-stroke;}
  .up .spark .line{stroke:var(--up);}   .up .spark .area{fill:var(--up-wash);}
  .down .spark .line{stroke:var(--down);} .down .spark .area{fill:var(--down-wash);}
  .flat .spark .line{stroke:var(--ink-3);} .flat .spark .area{fill:transparent;}
  .spark .cursor{stroke:var(--ink-3);stroke-width:1px;opacity:0;vector-effect:non-scaling-stroke;}
  .spark:hover .cursor{opacity:.7;}

  #tip{
    position:fixed;z-index:50;pointer-events:none;opacity:0;
    background:var(--ink);color:var(--plane);
    font-size:12px;font-weight:500;padding:5px 9px;border-radius:6px;
    transform:translate(-50%,-140%);white-space:nowrap;
    transition:opacity .1s ease;
  }
  #tip.show{opacity:1;}

  /* ============================================================
     DRILL-DOWN
     ============================================================ */
  #drilldownView{display:none;}
  #drilldownView.active{display:block;}
  .back{
    background:none;border:none;color:var(--ink-2);font:inherit;font-size:13px;
    cursor:pointer;padding:6px 0;display:inline-flex;align-items:center;gap:6px;
    margin-bottom:10px;
  }
  .back:hover{color:var(--ink);}
  .dd-head{margin-bottom:18px;}
  .dd-head h2{font-size:24px;margin:0;font-weight:650;letter-spacing:-0.02em;}
  .dd-head .dd-sub{color:var(--ink-2);font-size:13px;margin-top:4px;}

  .table-wrap{
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);overflow:hidden;
  }
  table{width:100%;border-collapse:collapse;font-size:14px;}
  thead th{
    text-align:left;font-size:11px;letter-spacing:0.07em;text-transform:uppercase;
    color:var(--ink-3);font-weight:600;padding:11px 16px;
    border-bottom:1px solid var(--line);background:var(--surface-2);
  }
  thead th.r,tbody td.r{text-align:right;}
  tbody td{padding:9px 16px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover td{background:var(--surface-2);}
  td.sym{font-weight:600;letter-spacing:-0.01em;}
  td.r.num{white-space:nowrap;}
  td.chg{font-weight:620;white-space:nowrap;}
  tr.up td.chg{color:var(--up);} tr.down td.chg{color:var(--down);} tr.flat td.chg{color:var(--ink-2);}
  td .spark{height:26px;width:104px;margin:0;}
  .col-rank{width:52px;} .col-trend{width:124px;}

  .empty{
    background:var(--surface);border:1px dashed var(--border-strong);
    border-radius:var(--radius);padding:40px 24px;text-align:center;color:var(--ink-2);
  }
  .empty code{
    background:var(--surface-2);padding:2px 6px;border-radius:4px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:var(--ink);
  }
  .skeleton{height:132px;border-radius:var(--radius);background:var(--surface);
            border:1px solid var(--border);opacity:.6;animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.45;}50%{opacity:.75;}}

  footer{margin-top:34px;font-size:12px;color:var(--ink-3);line-height:1.6;}

  @media (max-width:640px){
    .app{padding:22px 14px 56px;}
    header{flex-direction:column;gap:14px;}
    h1{font-size:22px;}
    .controls{width:100%;}
    .col-trend{display:none;}
    td .spark{display:none;}
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none!important;animation:none!important;}
    .card:hover{transform:none;}
  }
</style>
</head>
<body>
<div class="app">

  <nav class="tabs">
    <a href="/" aria-current="page">Performance board</a>
    <a href="/rrg">Rotation (RRG)</a>
  </nav>

  <header>
    <div>
      <div class="eyebrow">NSE · Equity Sectors</div>
      <h1>Sector Performance Board</h1>
      <div class="sub">Official NSE index values. Select a sector to see its constituents.</div>
    </div>
    <div class="controls">
      <div class="seg" id="tfToggle" role="group" aria-label="Timeframe">
        <button data-tf="daily" aria-pressed="true">Daily</button>
        <button data-tf="weekly" aria-pressed="false">Weekly</button>
        <button data-tf="monthly" aria-pressed="false">Monthly</button>
      </div>
      <button class="btn" id="autoBtn" aria-pressed="false" title="Re-fetch every 30 seconds">
        <span class="dot"></span>Auto
      </button>
      <button class="btn primary" id="refreshBtn">Refresh</button>
      <button class="btn icon-btn" id="themeBtn" title="Switch theme" aria-label="Switch theme">☾</button>
    </div>
  </header>

  <div class="meta">
    <span id="stamp">Loading live data…</span>
    <span class="sep" id="metaSep" hidden>·</span>
    <span id="liveStatus"></span>
    <span id="loadHint" hidden style="opacity:.75"></span>
  </div>

  <!-- OVERVIEW -->
  <div id="overviewView">
    <div class="summary" id="summary" hidden></div>
    <div class="section-head">
      <h2>All sectors — best to worst</h2>
      <span class="hint" id="gridHint"></span>
    </div>
    <div class="grid" id="sectorGrid"></div>
  </div>

  <!-- DRILL-DOWN -->
  <div id="drilldownView">
    <button class="back" id="backBtn">← All sectors</button>
    <div class="dd-head">
      <h2 id="ddTitle"></h2>
      <div class="dd-sub" id="ddSub"></div>
    </div>
    <div class="summary" id="ddSummary"></div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="col-rank">#</th>
            <th>Symbol</th>
            <th class="r">LTP</th>
            <th class="col-trend">Trend</th>
            <th class="r">Change</th>
          </tr>
        </thead>
        <tbody id="ddTableBody"></tbody>
      </table>
    </div>
  </div>

  <footer id="footer"></footer>
</div>

<div id="tip" role="status" aria-live="off"></div>

<script>
/* ---------------- theme ---------------- */
const THEME_KEY = 'spb-theme';
function applyTheme(t){
  const theme = t === 'light' ? 'light' : 'dark';      // dark is the default
  document.documentElement.setAttribute('data-theme', theme);
  const btn = document.getElementById('themeBtn');
  btn.textContent = theme === 'light' ? '☀' : '☾';
  btn.title = 'Switch to ' + (theme === 'light' ? 'dark' : 'light') + ' theme';
  btn.setAttribute('aria-label', btn.title);
  try{ localStorage.setItem(THEME_KEY, theme); }catch(e){}
}
(function initTheme(){
  let t = 'dark';
  try{ t = localStorage.getItem(THEME_KEY) || 'dark'; }catch(e){}
  applyTheme(t);
})();
document.getElementById('themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  applyTheme(cur === 'light' ? 'dark' : 'light');
});

/* ---------------- state ---------------- */
let state = { timeframe:'daily', sectors:[], constituents:[], selectedSector:null, meta:null };

const fieldForTf = (tf) => tf === 'weekly' ? 'prevW' : tf === 'monthly' ? 'prevM' : 'prevD';
const sparkKey   = (tf) => tf === 'weekly' ? 'w'     : tf === 'monthly' ? 'm'     : 'd';
const TV_BASE = 'https://in.tradingview.com/chart/?symbol=';
const tvUrl = (tv) => TV_BASE + encodeURIComponent(tv);
// `tv` is supplied by the server (universe.py) so symbol mapping lives in one place.
function tvLink(tv, label, cls){
  if(!tv) return label;
  return `<a class="tv ${cls||''}" href="${tvUrl(tv)}" target="_blank" rel="noopener noreferrer"
     title="Open ${tv} on TradingView">${label}<span class="ext">↗</span></a>`;
}

const tfLabel    = (tf) => tf.charAt(0).toUpperCase() + tf.slice(1);

function pctChange(row, tf){
  const prev = row[fieldForTf(tf)];
  if(!prev) return null;
  return (row.ltp - prev) / prev * 100;
}
function dirOf(v){ return v === null || v === undefined || isNaN(v) ? 'flat' : v > 0.0001 ? 'up' : v < -0.0001 ? 'down' : 'flat'; }
function arrowOf(d){ return d === 'up' ? '▲' : d === 'down' ? '▼' : '—'; }
function fmtPct(v){
  if(v === null || v === undefined || isNaN(v)) return 'n/a';
  return (v >= 0 ? '+' : '') + v.toFixed(2) + '%';
}
function fmtPrice(v){
  return v.toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function rankedSectors(){
  return state.sectors.map(s => ({...s, pct: pctChange(s, state.timeframe)}))
                      .sort((a,b) => (b.pct ?? -1e9) - (a.pct ?? -1e9));
}
function rankedConstituents(name){
  return state.constituents.filter(c => c.sector === name)
                           .map(c => ({...c, pct: pctChange(c, state.timeframe)}))
                           .sort((a,b) => (b.pct ?? -1e9) - (a.pct ?? -1e9));
}

/* ---------------- sparkline ----------------
   Direction is carried by the arrow and the sign as well as by colour:
   green/red alone are not separable under red-green colour blindness. */
function sparkSvg(vals, ref){
  if(!vals || vals.length < 2) return '';
  const W = 100, H = 38;
  const lo = Math.min(...vals, ref ?? Infinity);
  const hi = Math.max(...vals, ref ?? -Infinity);
  const span = (hi - lo) || 1;
  const x = i => (i / (vals.length - 1) * W).toFixed(2);
  const y = v => (H - ((v - lo) / span) * (H - 3) - 1.5).toFixed(2);
  const pts  = vals.map((v,i) => x(i) + ',' + y(v)).join(' ');
  const base = (ref ? `<polyline class="base" points="0,${y(ref)} ${W},${y(ref)}"/>` : '');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"
            data-vals="${vals.join(',')}">
    <polygon class="area" points="0,${H} ${pts} ${W},${H}"/>
    ${base}
    <polyline class="line" points="${pts}"/>
    <line class="cursor" x1="0" y1="0" x2="0" y2="${H}"/>
  </svg>`;
}
function sparkFor(row){
  return sparkSvg(row.spark && row.spark[sparkKey(state.timeframe)], row[fieldForTf(state.timeframe)]);
}

/* shared hover readout for every sparkline on the page */
const tip = document.getElementById('tip');
document.addEventListener('mousemove', (e) => {
  const svg = e.target.closest ? e.target.closest('.spark') : null;
  if(!svg){ tip.classList.remove('show'); return; }
  const vals = (svg.dataset.vals || '').split(',').map(Number).filter(v => !isNaN(v));
  if(vals.length < 2){ tip.classList.remove('show'); return; }
  const r = svg.getBoundingClientRect();
  const f = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  const i = Math.round(f * (vals.length - 1));
  const first = vals[0], v = vals[i];
  const d = first ? (v - first) / first * 100 : 0;
  tip.textContent = fmtPrice(v) + '   ' + (d >= 0 ? '+' : '') + d.toFixed(2) + '%';
  tip.style.left = e.clientX + 'px';
  tip.style.top  = r.top + 'px';
  tip.classList.add('show');
  const line = svg.querySelector('.cursor');
  if(line){ const xx = (f * 100).toFixed(2); line.setAttribute('x1', xx); line.setAttribute('x2', xx); }
}, {passive:true});

/* ---------------- render ---------------- */
function statTile(label, value, note, cls){
  return `<div class="stat ${cls||''}">
    <div class="label">${label}</div>
    <div class="value num">${value}</div>
    ${note ? `<div class="note">${note}</div>` : ''}
  </div>`;
}

function renderSummary(list){
  const el = document.getElementById('summary');
  if(!list.length){ el.hidden = true; return; }
  el.hidden = false;
  const up = list.filter(s => (s.pct ?? 0) > 0).length;
  const down = list.filter(s => (s.pct ?? 0) < 0).length;
  const best = list[0], worst = list[list.length - 1];
  el.innerHTML =
    statTile('Advancing', `${up}<small> / ${list.length}</small>`, `${down} declining`, up >= down ? 'up' : '') +
    statTile('Leading',  best.sector,  `${fmtPct(best.pct)} · ${best.indexSymbol}`,  dirOf(best.pct)) +
    statTile('Lagging',  worst.sector, `${fmtPct(worst.pct)} · ${worst.indexSymbol}`, dirOf(worst.pct)) +
    statTile('Timeframe', tfLabel(state.timeframe), 'vs previous close');
}

function renderGrid(){
  const list = rankedSectors();
  renderSummary(list);
  const grid = document.getElementById('sectorGrid');
  document.getElementById('gridHint').textContent = list.length ? `${list.length} sectors` : '';
  if(!list.length){
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1">
      <strong>No data yet.</strong><br>Press <strong>Refresh</strong> — if that fails, start the server with <code>python app.py</code>.
    </div>`;
    return;
  }
  grid.innerHTML = list.map((s,i) => {
    const d = dirOf(s.pct);
    return `<div class="card ${d}" data-sector="${s.sector}" role="button" tabindex="0"
                 aria-label="${s.sector}, ${fmtPct(s.pct)}. Show constituents.">
      <div class="card-top">
        <div>
          <div class="name">${s.sector}</div>
          <div class="idx">${s.indexSymbol}</div>
        </div>
        <div class="rank num">${i+1}</div>
      </div>
      ${tvLink(s.tv, 'Chart', 'tv-corner')}
      <div class="pct num"><span class="arrow">${arrowOf(d)}</span>${fmtPct(s.pct)}</div>
      ${sparkFor(s)}
    </div>`;
  }).join('');
  grid.querySelectorAll('.card').forEach(c => {
    c.addEventListener('click', e => {
      if(e.target.closest('a')) return;          // let the TradingView link through
      openDrilldown(c.dataset.sector);
    });
    c.addEventListener('keydown', e => {
      if((e.key === 'Enter' || e.key === ' ') && !e.target.closest('a')){
        e.preventDefault(); openDrilldown(c.dataset.sector);
      }
    });
  });
}

function renderDrilldown(){
  const name = state.selectedSector;
  const row  = state.sectors.find(s => s.sector === name);
  const list = rankedConstituents(name);
  const d    = dirOf(row && pctChange(row, state.timeframe));
  document.getElementById('ddTitle').textContent = name;
  document.getElementById('ddSub').innerHTML =
    (row ? tvLink(row.tv, row.indexSymbol) + ' · ' : '') +
    tfLabel(state.timeframe) + ' change · ' + list.length + ' constituents';

  const up = list.filter(c => (c.pct ?? 0) > 0).length;
  document.getElementById('ddSummary').innerHTML =
    (row ? statTile('Index', fmtPct(pctChange(row, state.timeframe)), row.indexSymbol, d) : '') +
    statTile('Advancing', `${up}<small> / ${list.length}</small>`, `${list.length - up} declining`, up >= list.length - up ? 'up' : '') +
    (list[0] ? statTile('Best', list[0].symbol, fmtPct(list[0].pct), dirOf(list[0].pct)) : '') +
    (list.length > 1 ? statTile('Worst', list[list.length-1].symbol, fmtPct(list[list.length-1].pct), dirOf(list[list.length-1].pct)) : '');

  const tbody = document.getElementById('ddTableBody');
  if(!list.length){
    tbody.innerHTML = `<tr><td colspan="5" style="padding:26px 16px;text-align:center;color:var(--ink-2)">${
      stage.constituents==='loading' ? 'Loading constituents…'
      : stage.constituents==='error' ? 'Could not load constituents — press Refresh.'
      : 'No constituents for this sector.'}</td></tr>`;
    return;
  }
  tbody.innerHTML = list.map((c,i) => {
    const cd = dirOf(c.pct);
    return `<tr class="${cd}">
      <td class="num" style="color:var(--ink-3)">${i+1}</td>
      <td class="sym">${tvLink(c.tv, c.symbol)}</td>
      <td class="r num">${fmtPrice(c.ltp)}</td>
      <td class="col-trend">${sparkFor(c)}</td>
      <td class="r chg num">${arrowOf(cd)} ${fmtPct(c.pct)}</td>
    </tr>`;
  }).join('');
}

function openDrilldown(name){
  if(!state.constituents.length && stage.constituents==='loading'){
    setLiveStatus('Loading constituents…', true);
  }
  state.selectedSector = name;
  document.getElementById('overviewView').style.display = 'none';
  document.getElementById('drilldownView').classList.add('active');
  window.scrollTo({top:0, behavior:'instant'});
  renderDrilldown();
}
function closeDrilldown(){
  state.selectedSector = null;
  document.getElementById('overviewView').style.display = '';
  document.getElementById('drilldownView').classList.remove('active');
}
function rerender(){ state.selectedSector ? renderDrilldown() : renderGrid(); }

function setTimeframe(tf){
  state.timeframe = tf;
  document.querySelectorAll('#tfToggle button').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.tf === tf)));
  rerender();
}
document.getElementById('tfToggle').addEventListener('click', e => {
  const b = e.target.closest('button');
  if(b) setTimeframe(b.dataset.tf);
});
document.getElementById('backBtn').addEventListener('click', closeDrilldown);

function renderStamp(data){
  const el = document.getElementById('stamp');
  if(data && data.generated_at){
    const t = new Date(data.generated_at);
    const s = Math.max(0, Math.round((Date.now() - t.getTime())/1000));
    const age = s < 90 ? s + 's ago' : s < 5400 ? Math.round(s/60) + 'm ago' : Math.round(s/3600) + 'h ago';
    el.textContent = t.toLocaleString('en-IN', {dateStyle:'medium', timeStyle:'short'}) + ' · ' + age;
  }else{
    el.textContent = 'Loading live data…';
  }
}
function setLiveStatus(text, ok){
  const el = document.getElementById('liveStatus');
  el.textContent = text || '';
  el.style.color = text ? (ok ? 'var(--ink-3)' : 'var(--down)') : '';
  document.getElementById('metaSep').hidden = !text;
}

/* ---------------- data ----------------
   Loaded in three stages, in the order the page can use them. Profiled on live
   data the grid needs 0.2s of work and 2KB; the drilldown rows need another
   2.2s, and the sparklines 2.6s and 146KB. Waiting for all of it before drawing
   anything meant a five-second stare at a skeleton for data that was not on
   screen yet.

     1. sectors       -> the grid paints
     2. constituents  -> drilldown becomes available
     3. sparks        -> sparklines fill in

   Each stage renders as it lands, so the page is useful long before it is
   complete. A stage failing leaves the ones before it intact.
------------------------------------------- */
// `gen` supersedes rather than blocks. The old code kept a single `fetching` flag
// set until every background stage finished, but re-enabled the button after the
// first one - so a click during stages 2 and 3 hit the guard and did nothing at
// all, with the button looking perfectly usable. Now each load takes a ticket, a
// newer load invalidates older ones, and results from a superseded load are
// discarded instead of overwriting fresher data.
let gen = 0;
const stage = {sectors:'idle', constituents:'idle', sparks:'idle'};

function setStageNote(){
  const pending = Object.entries(stage)
    .filter(([,v])=>v==='loading')
    .map(([k])=>k==='constituents'?'stocks':k);
  const el = document.getElementById('loadHint');
  if(!el) return;
  el.textContent = pending.length ? 'loading ' + pending.join(' + ') + '…' : '';
  el.hidden = !pending.length;
}

async function getJSON(url, force){
  const u = url + (force ? (url.includes('?')?'&':'?') + 'force=1' : '');
  const r = await fetch(u, {cache:'no-store'});
  if(!r.ok) throw new Error('HTTP ' + r.status);
  const d = await r.json();
  if(d.error) throw new Error(d.error);
  return d;
}

function mergeSparks(sp){
  state.sectors = state.sectors.map(s=>({...s, spark: sp.sectors[s.sector] || s.spark}));
  state.constituents = state.constituents.map(c=>({...c, spark: sp.constituents[c.symbol] || c.spark}));
}

async function loadLive(force){
  const my = ++gen;
  const current = () => my === gen;
  const btn=document.getElementById('refreshBtn');
  btn.textContent='Loading…'; btn.disabled=true;
  if(!state.sectors.length){
    document.getElementById('sectorGrid').innerHTML =
      Array.from({length:6},()=>'<div class="skeleton"></div>').join('');
  }

  // --- stage 1: the grid -------------------------------------------------
  stage.sectors='loading'; setStageNote();
  try{
    const d = await getJSON('/api/sectors.json', force);
    if(!current()) return;
    state.sectors = d.sectors;
    state.meta = d;
    renderStamp(d);
    setLiveStatus(`${d.sectors.length} sectors · ${d.source}`, true);
    document.getElementById('footer').textContent = d.note || '';
    rerender();
    stage.sectors='done';
  }catch(e){
    if(!current()) return;
    stage.sectors='error';
    const unreachable=/Failed to fetch|NetworkError|load failed/i.test(e.message);
    setLiveStatus('Could not load sectors: '+e.message+(unreachable?' — is app.py running?':''), false);
    if(!state.sectors.length) renderGrid();
  }
  setStageNote();
  btn.textContent='Refresh'; btn.disabled=false;   // usable again as soon as the grid is up

  // --- stages 2 and 3: behind the grid, in parallel ----------------------
  stage.constituents='loading'; stage.sparks='loading'; setStageNote();
  const jobs = [
    getJSON('/api/constituents.json', force).then(d=>{
      if(!current()) return;
      state.constituents = d.constituents;
      if(state.meta) state.meta.weekly_missing = d.weekly_missing;
      stage.constituents='done';
      rerender(); setStageNote();
    }).catch(e=>{ stage.constituents='error'; setStageNote();
      console.warn('constituents failed', e.message); }),

    getJSON('/api/sparks.json', force).then(d=>{
      if(!current()) return;
      mergeSparks(d);
      stage.sparks='done';
      rerender(); setStageNote();
    }).catch(e=>{ stage.sparks='error'; setStageNote();
      console.warn('sparks failed', e.message); }),
  ];
  await Promise.allSettled(jobs);
  if(!current()) return;                 // a newer load owns the page now
  setStageNote();

  // the rotation page is one click away; have its data ready before it is asked for
  if(!force) prefetchRRG();
}

let rrgPrefetched=false;
function prefetchRRG(){
  if(rrgPrefetched) return;
  rrgPrefetched=true;
  const go=()=>fetch('/api/rrg.json?scope=sectors&tf=weekly&tail=12&bench=nifty',
                     {cache:'no-store'}).catch(()=>{});
  ('requestIdleCallback' in window) ? requestIdleCallback(go,{timeout:4000}) : setTimeout(go,2500);
}

const fetchLiveNow = loadLive;
document.getElementById('refreshBtn').addEventListener('click', ()=>loadLive(true));

/* ---------------- auto-refresh ---------------- */
const AUTO_MS = 30000;
let autoTimer = null;
const loading = () => Object.values(stage).some(v=>v==='loading');

function setAuto(on){
  const btn = document.getElementById('autoBtn');
  if(autoTimer){ clearInterval(autoTimer); autoTimer = null; }
  btn.classList.toggle('on', !!on);
  btn.setAttribute('aria-pressed', String(!!on));
  if(on){ autoTimer = setInterval(fetchLiveNow, AUTO_MS); fetchLiveNow(); }
}
document.getElementById('autoBtn').addEventListener('click', () => setAuto(!autoTimer));

/* ---------------- init ---------------- */
renderGrid();
fetchLiveNow();
setInterval(() => { if(state.meta) renderStamp(state.meta); }, 15000);
</script>
</body>
