<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NIFTY Sector Performance Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B111E;
    --bg-panel:#121A2B;
    --bg-panel-2:#0E1524;
    --ink:#ECE9DF;
    --ink-muted:#8791A6;
    --gold:#D7A947;
    --gold-dim:#8A7238;
    --green:#2FBE6B;
    --green-dim:#173321;
    --red:#E5594B;
    --red-dim:#3A1A17;
    --border:rgba(236,233,223,0.09);
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:1180px;margin:0 auto;padding:28px 24px 60px;}

  .display{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:0.01em;}
  .mono{font-family:'JetBrains Mono',monospace;}

  /* ---------- HEADER ---------- */
  header{
    display:flex;justify-content:space-between;align-items:flex-end;
    flex-wrap:wrap;gap:16px;
    border-bottom:1px solid var(--border);
    padding-bottom:18px;margin-bottom:22px;
  }
  .brand .eyebrow{
    font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.18em;
    color:var(--gold);text-transform:uppercase;margin-bottom:6px;
  }
  .brand h1{
    font-size:34px;line-height:1;margin:0;text-transform:uppercase;
  }
  .brand .sub{color:var(--ink-muted);font-size:13px;margin-top:6px;}
  .header-controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}

  .tf-toggle{
    display:flex;background:var(--bg-panel-2);border:1px solid var(--border);border-radius:999px;padding:3px;
  }
  .tf-toggle button{
    border:none;background:transparent;color:var(--ink-muted);
    font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.04em;
    padding:8px 14px;border-radius:999px;cursor:pointer;transition:all .15s ease;
  }
  .tf-toggle button.active{background:var(--gold);color:#141414;font-weight:700;}
  .tf-toggle button:not(.active):hover{color:var(--ink);}

  .btn{
    font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.04em;
    background:var(--bg-panel-2);color:var(--ink);border:1px solid var(--border);
    padding:9px 16px;border-radius:8px;cursor:pointer;transition:border-color .15s ease;
  }
  .btn:hover{border-color:var(--gold-dim);}
  .btn.primary{background:var(--gold);color:#141414;border-color:var(--gold);font-weight:700;}
  .btn.primary:hover{filter:brightness(1.08);}

  .stamp{color:var(--ink-muted);font-family:'JetBrains Mono',monospace;font-size:11px;}

  /* ---------- HERO ---------- */
  .hero{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:26px;}
  .hero-card{
    background:linear-gradient(160deg,var(--bg-panel),var(--bg-panel-2));
    border:1px solid var(--border);border-radius:var(--radius);
    padding:20px 22px;position:relative;overflow:hidden;
  }
  .hero-card.up{border-left:3px solid var(--green);}
  .hero-card.down{border-left:3px solid var(--red);}
  .hero-label{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.14em;color:var(--ink-muted);text-transform:uppercase;}
  .hero-name{font-size:28px;margin:4px 0 2px;text-transform:uppercase;}
  .hero-pct{font-family:'JetBrains Mono',monospace;font-size:30px;font-weight:700;}
  .hero-card.up .hero-pct{color:var(--green);}
  .hero-card.down .hero-pct{color:var(--red);}
  .hero-sym{color:var(--ink-muted);font-family:'JetBrains Mono',monospace;font-size:12px;margin-top:2px;}

  /* ---------- SPARKLINE ---------- */
  .spark{display:block;width:100%;height:34px;margin-top:10px;overflow:visible;}
  .spark polyline{fill:none;stroke-width:1.6px;vector-effect:non-scaling-stroke;}
  .spark .area{stroke:none;opacity:0.13;}
  .up .spark polyline{stroke:var(--green);} .up .spark .area{fill:var(--green);}
  .down .spark polyline{stroke:var(--red);}  .down .spark .area{fill:var(--red);}
  .spark .base{stroke:var(--ink-muted);stroke-width:1px;opacity:0.28;stroke-dasharray:2 3;}
  td .spark{height:22px;width:96px;margin:0;}

  /* ---------- GRID ---------- */
  .section-label{
    font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.14em;
    color:var(--ink-muted);text-transform:uppercase;margin:0 0 12px 2px;
  }
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}
  .tile{
    background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px 18px;cursor:pointer;position:relative;overflow:hidden;
    transform-origin:top;animation:flapin .45s cubic-bezier(.2,.7,.3,1) both;
    transition:transform .15s ease,border-color .15s ease;
  }
  .tile:hover{transform:translateY(-3px);border-color:var(--gold-dim);}
  .tile .rank{
    position:absolute;top:12px;right:14px;font-family:'JetBrains Mono',monospace;
    font-size:11px;color:var(--ink-muted);
  }
  .tile .name{font-size:22px;text-transform:uppercase;margin-bottom:2px;}
  .tile .idx-sym{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-muted);margin-bottom:12px;}
  .tile .pct{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:700;}
  .tile.up .pct{color:var(--green);}
  .tile.down .pct{color:var(--red);}
  .tile .tag{
    display:inline-block;margin-top:8px;font-family:'JetBrains Mono',monospace;font-size:10px;
    letter-spacing:0.08em;padding:2px 8px;border-radius:4px;text-transform:uppercase;
  }
  .tile.tag-top .tag{background:var(--green-dim);color:var(--green);}
  .tile.tag-bottom .tag{background:var(--red-dim);color:var(--red);}

  @keyframes flapin{
    from{opacity:0;transform:rotateX(-90deg);}
    to{opacity:1;transform:rotateX(0deg);}
  }

  /* ---------- DRILLDOWN ---------- */
  .drilldown{display:none;}
  .drilldown.active{display:block;}
  .back-row{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
  .back-btn{
    font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-muted);
    background:none;border:1px solid var(--border);border-radius:8px;padding:8px 14px;cursor:pointer;
  }
  .back-btn:hover{color:var(--ink);border-color:var(--gold-dim);}
  .dd-title{font-size:30px;text-transform:uppercase;margin:0;}
  .dd-sub{color:var(--ink-muted);font-family:'JetBrains Mono',monospace;font-size:12px;}

  table.const-table{width:100%;border-collapse:collapse;margin-top:18px;}
  .const-table th{
    text-align:left;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.08em;
    color:var(--ink-muted);text-transform:uppercase;padding:10px 14px;border-bottom:1px solid var(--border);
  }
  .const-table td{
    padding:11px 14px;border-bottom:1px solid var(--border);font-family:'JetBrains Mono',monospace;font-size:13px;
  }
  .const-table td.sym{font-family:'Inter',sans-serif;font-weight:600;letter-spacing:0.02em;}
  .const-table tr.row-top td{background:var(--green-dim);}
  .const-table tr.row-bottom td{background:var(--red-dim);}
  .const-table td.pct.up{color:var(--green);font-weight:700;}
  .const-table td.pct.down{color:var(--red);font-weight:700;}
  .const-table td.rank{color:var(--ink-muted);}

  /* ---------- MODAL ---------- */

  @media (max-width:640px){
    .hero{grid-template-columns:1fr;}
    .brand h1{font-size:26px;}
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="brand">
      <div class="eyebrow">NSE &middot; Equity Sectors</div>
      <h1>Sector Performance Board</h1>
      <div class="sub">Click a sector to drill into its constituents</div>
    </div>
    <div class="header-controls">
      <div class="tf-toggle" id="tfToggle">
        <button data-tf="daily" class="active">Daily</button>
        <button data-tf="weekly">Weekly</button>
        <button data-tf="monthly">Monthly</button>
      </div>
      <button class="btn" id="autoBtn">Auto-refresh: off</button>
      <button class="btn primary" id="loadDataBtn">Refresh</button>
    </div>
  </header>

  <div class="stamp" id="stamp" style="margin-bottom:18px;"></div>
  <div class="stamp" id="liveStatus" style="margin-bottom:18px;display:none;"></div>

  <!-- SECTOR OVERVIEW -->
  <div id="overviewView">
    <div class="hero" id="heroRow"></div>
    <div class="section-label">All sectors — best to worst</div>
    <div class="grid" id="sectorGrid"></div>
  </div>

  <!-- DRILLDOWN -->
  <div class="drilldown" id="drilldownView">
    <div class="back-row">
      <button class="back-btn" id="backBtn">&larr; All sectors</button>
    </div>
    <h2 class="dd-title" id="ddTitle"></h2>
    <div class="dd-sub" id="ddSub"></div>
    <div class="hero" id="ddHero" style="margin-top:18px;"></div>
    <table class="const-table">
      <thead>
        <tr><th>Rank</th><th>Symbol</th><th>LTP</th><th>Trend</th><th>% Chg</th></tr>
      </thead>
      <tbody id="ddTableBody"></tbody>
    </table>
  </div>

</div>

<script>

let state = {
  timeframe: 'daily',
  sectors: [],
  constituents: [],
  selectedSector: null,
};

const fieldForTf = (tf) => tf === 'weekly' ? 'prevW' : tf === 'monthly' ? 'prevM' : 'prevD';  // daily

function pctChange(row, tf){
  const field = fieldForTf(tf);
  const prev = row[field];
  if(!prev) return null;
  return (row.ltp - prev) / prev * 100;
}

function fmtPct(v){
  if(v === null || v === undefined || isNaN(v)) return 'n/a';
  const s = v >= 0 ? '+' : '';
  return s + v.toFixed(2) + '%';
}

// Inline sparkline: closes -> polyline, plus a dashed line at the reference price
// so you can see at a glance which side of it the series has been sitting on.
function sparkSvg(vals, ref){
  if(!vals || vals.length < 2) return '';
  const W = 100, H = 34;
  const lo = Math.min(...vals, ref ?? Infinity);
  const hi = Math.max(...vals, ref ?? -Infinity);
  const span = (hi - lo) || 1;
  const x = i => (i / (vals.length - 1) * W).toFixed(2);
  const y = v => (H - ((v - lo) / span) * H).toFixed(2);
  const pts = vals.map((v, i) => x(i) + ',' + y(v)).join(' ');
  const area = `0,${H} ${pts} ${W},${H}`;
  const base = ref ? `<polyline class="base" points="0,${y(ref)} ${W},${y(ref)}"/>` : '';
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">` +
         `<polyline class="area" points="${area}"/>${base}<polyline points="${pts}"/></svg>`;
}

const sparkKey = (tf) => tf === 'weekly' ? 'w' : tf === 'monthly' ? 'm' : 'd';

function sparkFor(row){
  const vals = row.spark && row.spark[sparkKey(state.timeframe)];
  return sparkSvg(vals, row[fieldForTf(state.timeframe)]);
}

function fmtPrice(v){
  return v.toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2});
}

function rankedSectors(){
  return state.sectors
    .map(s => ({...s, pct: pctChange(s, state.timeframe)}))
    .sort((a,b) => (b.pct ?? -999) - (a.pct ?? -999));
}

function rankedConstituents(sectorName){
  return state.constituents
    .filter(c => c.sector === sectorName)
    .map(c => ({...c, pct: pctChange(c, state.timeframe)}))
    .sort((a,b) => (b.pct ?? -999) - (a.pct ?? -999));
}

function renderStamp(data){
  const el = document.getElementById('stamp');
  if(data && data.generated_at){
    const t = new Date(data.generated_at);
    const ageSec = Math.max(0, Math.round((Date.now() - t.getTime())/1000));
    const age = ageSec < 90 ? ageSec + 's ago'
              : ageSec < 5400 ? Math.round(ageSec/60) + 'm ago'
              : Math.round(ageSec/3600) + 'h ago';
    el.textContent = 'Data generated ' + t.toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'medium'}) +
                     '  (' + age + ')';
  }else{
    el.textContent = 'Loading live data...';
  }
}

function renderHero(list, targetEl, topLabel='TOP SECTOR', bottomLabel='BOTTOM SECTOR', nameKey='sector', symKey='indexSymbol'){
  targetEl.innerHTML = '';
  if(list.length === 0) return;
  const top = list[0];
  const bottom = list[list.length - 1];
  [[top, topLabel, 'up'], [bottom, bottomLabel, 'down']].forEach(([item, label, dir]) => {
    const card = document.createElement('div');
    card.className = 'hero-card ' + dir;
    card.innerHTML = `
      <div class="hero-label">${label}</div>
      <div class="hero-name display">${item[nameKey]}</div>
      <div class="hero-sym">${item[symKey] ?? ''}</div>
      <div class="hero-pct">${fmtPct(item.pct)}</div>
      ${sparkFor(item)}
    `;
    targetEl.appendChild(card);
  });
}

function renderGrid(){
  const list = rankedSectors();
  renderHero(list, document.getElementById('heroRow'));
  const grid = document.getElementById('sectorGrid');
  grid.innerHTML = '';
  if(list.length === 0){
    grid.innerHTML = '<div class="stamp">No data yet. Click <b>Refresh</b> — ' +
                     'if that fails, start the server with <b>python app.py</b>.</div>';
    return;
  }
  list.forEach((s, i) => {
    const dir = (s.pct ?? 0) >= 0 ? 'up' : 'down';
    const tag = i === 0 ? 'top' : i === list.length - 1 ? 'bottom' : '';
    const tile = document.createElement('div');
    tile.className = `tile ${dir} ${tag ? 'tag-' + tag : ''}`;
    tile.style.animationDelay = (i * 0.03) + 's';
    tile.innerHTML = `
      <div class="rank">#${i+1}</div>
      <div class="name display">${s.sector}</div>
      <div class="idx-sym">${s.indexSymbol}</div>
      <div class="pct">${fmtPct(s.pct)}</div>
      ${sparkFor(s)}
      ${tag ? `<div class="tag">${tag === 'top' ? 'Best' : 'Worst'} today</div>` : ''}
    `;
    tile.addEventListener('click', () => openDrilldown(s.sector));
    grid.appendChild(tile);
  });
}

function openDrilldown(sectorName){
  state.selectedSector = sectorName;
  document.getElementById('overviewView').style.display = 'none';
  document.getElementById('drilldownView').classList.add('active');
  renderDrilldown();
}

function closeDrilldown(){
  state.selectedSector = null;
  document.getElementById('overviewView').style.display = '';
  document.getElementById('drilldownView').classList.remove('active');
}

function renderDrilldown(){
  const sectorName = state.selectedSector;
  const sectorRow = state.sectors.find(s => s.sector === sectorName);
  document.getElementById('ddTitle').textContent = sectorName;
  document.getElementById('ddSub').textContent =
    (sectorRow ? sectorRow.indexSymbol + ' — ' : '') +
    document.querySelector(`#tfToggle button[data-tf="${state.timeframe}"]`).textContent + ' change';

  const list = rankedConstituents(sectorName);
  renderHero(list, document.getElementById('ddHero'), 'BEST PERFORMER', 'WORST PERFORMER', 'symbol', null);
  document.querySelectorAll('#ddHero .hero-sym').forEach(el => el.remove());

  const topN = Math.min(3, Math.floor(list.length / 2) || 1);
  const tbody = document.getElementById('ddTableBody');
  tbody.innerHTML = '';
  list.forEach((c, i) => {
    const dir = (c.pct ?? 0) >= 0 ? 'up' : 'down';
    const rowClass = i < topN ? 'row-top' : i >= list.length - topN ? 'row-bottom' : '';
    const tr = document.createElement('tr');
    tr.className = rowClass;
    tr.innerHTML = `
      <td class="rank">${i+1}</td>
      <td class="sym">${c.symbol}</td>
      <td>${fmtPrice(c.ltp)}</td>
      <td class="${dir}">${sparkFor(c)}</td>
      <td class="pct ${dir}">${fmtPct(c.pct)}</td>
    `;
    tbody.appendChild(tr);
  });
}

function setTimeframe(tf){
  state.timeframe = tf;
  document.querySelectorAll('#tfToggle button').forEach(b => b.classList.toggle('active', b.dataset.tf === tf));
  if(state.selectedSector) renderDrilldown();
  else renderGrid();
}

document.getElementById('tfToggle').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if(!btn) return;
  setTimeframe(btn.dataset.tf);
});
document.getElementById('backBtn').addEventListener('click', closeDrilldown);

// ---------- live data ----------
const LIVE_ENDPOINT = '/api/live_data.json';

function setLiveStatus(text, ok){
  const el = document.getElementById('liveStatus');
  el.style.display = text ? '' : 'none';
  el.textContent = text;
  el.style.color = ok ? 'var(--green)' : 'var(--red)';
}

let fetching = false;

async function fetchLiveNow(){
  if(fetching) return;            // a slow fetch must not overlap the next tick
  fetching = true;
  const btn = document.getElementById('loadDataBtn');
  const label = 'Refresh';
  btn.textContent = 'Loading...';
  btn.disabled = true;
  setLiveStatus('Fetching live prices...', true);
  try{
    const res = await fetch(LIVE_ENDPOINT, {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if(!data.sectors || !data.constituents) throw new Error('Unexpected JSON shape');
    state.sectors = data.sectors;
    state.constituents = data.constituents;
    // stay where the user is: only leave a drilldown if that sector vanished
    if(state.selectedSector &&
       !state.constituents.some(c => c.sector === state.selectedSector)){
      closeDrilldown();
    }
    renderStamp(data);
    setLiveStatus(
      'Loaded ' + data.sectors.length + ' sectors / ' + data.constituents.length +
      ' stocks from ' + (data.source || 'live source') +
      (data.note ? '  |  ' + data.note : ''), true);
    if(state.selectedSector) renderDrilldown(); else renderGrid();
  }catch(e){
    setLiveStatus(
      'Could not load live data: ' + e.message +
      ' - is app.py running?  Start it with:  python app.py', false);
  }finally{
    fetching = false;
    btn.textContent = label;
    btn.disabled = false;
  }
}

document.getElementById('loadDataBtn').addEventListener('click', fetchLiveNow);

// ---------- auto-refresh ----------
const AUTO_MS = 30000;
let autoTimer = null;

function setAuto(on){
  const btn = document.getElementById('autoBtn');
  if(autoTimer){ clearInterval(autoTimer); autoTimer = null; }
  if(on){
    autoTimer = setInterval(fetchLiveNow, AUTO_MS);
    btn.textContent = 'Auto-refresh: on';
    btn.classList.add('primary');
    fetchLiveNow();
  }else{
    btn.textContent = 'Auto-refresh: off';
    btn.classList.remove('primary');
  }
}

document.getElementById('autoBtn').addEventListener('click', () => setAuto(!autoTimer));

// ---------- init ----------
renderStamp();
renderGrid();
fetchLiveNow();
</script>
</body>
</html>
